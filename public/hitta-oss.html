<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitta Oss | Mathörnet</title>
    <link rel="stylesheet" href="style_v5.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
</head>
<body>
    <!-- Preloader -->
    <div id="page-preloader" class="preloader">
        <div class="loader"></div>
    </div>
    
    <header class="main-header">
        <div class="header-inner container">
            <a href="mathornet.html" class="logo">
                <img src="img/mathörnet logo.png" alt="Mathörnet Logotyp" class="main-logo">
            </a>
            
            <button class="mobile-menu-toggle" aria-label="Öppna meny">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            <nav class="main-nav">
                <ul>
                    <li><a href="produkter.html">Produkter</a></li>
                    <li><a href="recept.html">Recept</a></li>
                    <li><a href="nyheter.html">Nyheter</a></li>
                    <li><a href="aterforsaljare.html">Återförsäljare</a></li>
                    <li><a href="om-oss.html">Om oss</a></li>
                    <li><a href="hitta-oss.html">Hitta oss</a></li>
                    <li><a href="kontakt.html">Kontakt</a></li>
                </ul>
            </nav>

            <div class="search-container">
                <button class="search-btn" aria-label="Sök">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <div class="search-dropdown">
                    <input type="text" id="search-input" placeholder="Sök, t.ex. falafel...">
                    <div class="search-results" id="search-results">
                        <!-- JS injected results -->
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="locator-container">
            <!-- Sidebar for Search and List -->
            <aside class="locator-sidebar">
                <div class="locator-search">
                    <h1>Hitta Mathörnet i din närmaste butik:</h1>
                    <div class="search-input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="store-search-input" placeholder="Sök efter adress, postnummer eller ort...">
                    </div>
                    <p style="margin-top: 1rem; color: #888; font-size: 0.9rem;" id="store-count-text">0 platser</p>
                </div>
                <ul class="locator-list" id="store-list">
                    <!-- Stores injected via JS -->
                </ul>
            </aside>

            <!-- Map Viewport -->
            <div class="locator-map-wrapper">
                <div id="locator-map"></div>
            </div>
        </section>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="main_v5.js"></script>
    <script src="js/store-locator.js"></script>
</body>
</html>
